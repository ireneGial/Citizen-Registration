name: CI/CD Pipeline for Citizen Registration

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 with Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run All Tests
        run: mvn clean verify

      - name: Upload Unit Test Reports (citizen-domain)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: citizen-domain/target/surefire-reports/*.xml

      - name: Upload Integration Test Reports (citizen-service)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: citizen-service/target/failsafe-reports/*.xml

  create-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 17 with Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package Application
        run: mvn clean package -DskipTests

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: release-${{ github.run_id }}
          release_name: "Release ${{ github.sha }}"
          body: "Auto-generated release from commit ${{ github.sha }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to GitHub Releases
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: citizen-service/target/citizen-service-1.0-SNAPSHOT.jar
          asset_name: citizen-service-1.0-SNAPSHOT.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
